[alembic]
script_location = alembic
# Make the `app` package importable from env.py when running the `alembic` CLI
# (not only via `python -m alembic`, which adds the working directory implicitly).
prepend_sys_path = .
# The database URL comes from app settings (DATABASE_URL), see alembic/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
